global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'taxi-rio-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']

  - job_name: 'taxi-rio-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:3001']
