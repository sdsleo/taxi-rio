services:
  # -------------------------------------------------------------
  # Bancos de Dados e Mensageria
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: taxi-rio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taxirio
      MYSQL_USER: taxirio_user
      MYSQL_PASSWORD: taxirio_pass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taxi-rio-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: taxi-rio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: taxirio_audit
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taxi-rio-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: 'taxirio_secret_erlang_cookie_secure_string_12345'
    ports:
      - '5672:5672' # AMQP protocol
      - '15672:15672' # Painel Web de Gerenciamento
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: taxi-rio-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: taxi-rio-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI Web
      - '4318:4318' # OTLP HTTP receiver
      - '4317:4317' # OTLP gRPC receiver

  # -------------------------------------------------------------
  # Aplicacoes do Monorepo
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: taxi-rio-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: dev_jwt_secret_key_taxi_rio_super_secure_example
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: taxirio_user
      MYSQL_PASSWORD: taxirio_pass
      MYSQL_DATABASE: taxirio
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: taxi-rio-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: taxi-rio-worker
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      METRICS_PORT: 3001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongoadmin:mongopassword@mongodb:27017/taxirio_audit?authSource=admin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_SERVICE_NAME: taxi-rio-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: ./ui/Dockerfile
    container_name: taxi-rio-ui
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  rabbitmq_data:
  prometheus_data:
