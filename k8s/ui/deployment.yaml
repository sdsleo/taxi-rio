apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxi-rio-ui
  namespace: taxi-rio
  labels:
    app.kubernetes.io/name: taxi-rio-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: taxi-rio-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taxi-rio-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: taxi-rio-ui
        app.kubernetes.io/name: taxi-rio-ui
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: taxi-rio-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
