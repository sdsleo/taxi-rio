apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: taxi-rio
  labels:
    app.kubernetes.io/name: taxi-rio-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: taxi-rio-platform
spec:
  type: NodePort
  selector:
    app: taxi-rio-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
