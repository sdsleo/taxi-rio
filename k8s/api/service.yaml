apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taxi-rio
  labels:
    app.kubernetes.io/name: taxi-rio-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taxi-rio-platform
spec:
  type: ClusterIP
  selector:
    app: taxi-rio-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
