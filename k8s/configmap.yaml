apiVersion: v1
kind: ConfigMap
metadata:
  name: taxirio-config
  namespace: taxi-rio
  labels:
    app.kubernetes.io/name: taxi-rio
    app.kubernetes.io/part-of: taxi-rio-platform
data:
  NODE_ENV: 'production'
  PORT: '3000'
  METRICS_PORT: '3001'
  MYSQL_HOST: 'mysql'
  MYSQL_PORT: '3306'
  MYSQL_DATABASE: 'taxirio'
  REDIS_HOST: 'redis'
  REDIS_PORT: '6379'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://jaeger:4318/v1/traces'
